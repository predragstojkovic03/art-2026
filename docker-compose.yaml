services:
  app:
    container_name: art-2026-app
    restart: unless-stopped
    image: art-2026-app-dev:1.0.0
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/shared/dist
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
      - "${WEB_PORT}:${WEB_PORT}"
    networks:
      - art-network
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      NODE_ENV: ${NODE_ENV}
      ORM_SYNC: ${ORM_SYNC}
      SERVER_PORT: ${SERVER_PORT}
      WEB_PORT: ${WEB_PORT}
      VITE_API_URL: ${VITE_API_URL}
    env_file:
      - .env

  postgres:
    image: postgres:17-alpine
    container_name: art-2026-postgres
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - art-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: art-2026-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    networks:
      - art-network
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

networks:
  art-network:

volumes:
  pgdata:
  pgadmin:
